<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- Definitions for Gradients, Shadows, and Markers -->
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#546E7A" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="gradIngest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B2EBF2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradStore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E1BEE7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9f9f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FDFDFD"/>

  <!-- Main Title -->
  <text x="40" y="50" font-size="24" font-weight="bold" fill="#263238">Substack Articles Search Engine</text>
  <text x="40" y="75" font-size="14" fill="#78909C">RAG Architecture • Hybrid Search • Deduplication</text>

  <!-- ========================================== -->
  <!-- SECTION 1: INGESTION (LEFT) -->
  <!-- ========================================== -->
  <rect x="30" y="120" width="300" height="600" rx="10" fill="url(#gradIngest)" stroke="#B2DFDB" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="45" y="150" font-size="14" font-weight="bold" fill="#00695C" opacity="0.7">INGESTION PIPELINE</text>

  <!-- RSS Node -->
  <g transform="translate(80, 250)" filter="url(#shadow)">
    <rect width="180" height="60" rx="6" fill="#FFFFFF" stroke="#00897B" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-size="14" fill="#333">RSS / Substack Feeds</text>
    <!-- RSS Icon simulation -->
    <circle cx="25" cy="30" r="4" fill="#FFA726"/>
    <path d="M21,38 A10,10 0 0,1 31,28" stroke="#FFA726" stroke-width="2" fill="none"/>
  </g>

  <!-- Prefect Node -->
  <g transform="translate(80, 380)" filter="url(#shadow)">
    <rect width="180" height="60" rx="6" fill="#FFFFFF" stroke="#039BE5" stroke-width="2"/>
    <text x="90" y="35" text-anchor="middle" font-size="14" fill="#333">Prefect Flows</text>
    <text x="90" y="52" text-anchor="middle" font-size="10" fill="#78909C">(Orchestration & Sched)</text>
  </g>

  <!-- Ingestion Worker Node -->
  <g transform="translate(80, 510)" filter="url(#shadow)">
    <rect width="180" height="60" rx="6" fill="#00897B" stroke="none"/>
    <text x="90" y="35" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Ingestion Worker</text>
    <text x="90" y="52" text-anchor="middle" font-size="10" fill="#E0F2F1">Parser & Normalizer</text>
  </g>

  <!-- Arrows Ingestion -->
  <line x1="170" y1="310" x2="170" y2="371" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="345" font-size="11" fill="#546E7A">fetch</text>

  <line x1="170" y1="440" x2="170" y2="501" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="475" font-size="11" fill="#546E7A">trigger</text>


  <!-- ========================================== -->
  <!-- SECTION 2: STORAGE & INDEXING (CENTER) -->
  <!-- ========================================== -->
  <rect x="350" y="120" width="440" height="600" rx="10" fill="url(#gradStore)" stroke="#BBDEFB" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="365" y="150" font-size="14" font-weight="bold" fill="#1565C0" opacity="0.7">STORAGE & INDEXING</text>

  <!-- Supabase Node (Article Store) -->
  <g transform="translate(400, 200)" filter="url(#shadow)">
    <!-- DB cylinder shape -->
    <path d="M0,15 C0,5 180,5 180,15 L180,65 C180,75 0,75 0,65 Z" fill="#3CD186" opacity="0.9"/>
    <ellipse cx="90" cy="15" rx="90" ry="10" fill="#5EE097"/>
    <text x="90" y="45" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Supabase / Postgres</text>
    <text x="90" y="62" text-anchor="middle" font-size="10" fill="#E8F5E9">Metadata & Raw Text</text>
  </g>

  <!-- Text Splitter Node -->
  <g transform="translate(400, 510)" filter="url(#shadow)">
    <rect width="160" height="60" rx="6" fill="#FFFFFF" stroke="#5E35B1" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" fill="#333">Text Splitter</text>
    <text x="80" y="45" text-anchor="middle" font-size="13" fill="#333">& Chunker</text>
  </g>

  <!-- Embeddings Node -->
  <g transform="translate(600, 510)" filter="url(#shadow)">
    <rect width="160" height="60" rx="6" fill="#FFFFFF" stroke="#5E35B1" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-size="13" fill="#333">Embeddings</text>
    <text x="80" y="45" text-anchor="middle" font-size="13" fill="#333">Generator</text>
  </g>

  <!-- Qdrant Node (Vector DB) -->
  <g transform="translate(580, 350)" filter="url(#shadow)">
    <!-- DB cylinder shape -->
    <path d="M0,15 C0,5 180,5 180,15 L180,65 C180,75 0,75 0,65 Z" fill="#E91E63" opacity="0.9"/>
    <ellipse cx="90" cy="15" rx="90" ry="10" fill="#F48FB1"/>
    <text x="90" y="45" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Qdrant Vector DB</text>
    <text x="90" y="62" text-anchor="middle" font-size="10" fill="#FCE4EC">Embeddings + Payloads</text>
  </g>

  <!-- Arrows Storage -->
  <!-- Worker to Supabase -->
  <path d="M260,540 L300,540 L300,240 L391,240" stroke="#546E7A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="380" font-size="11" fill="#546E7A" transform="rotate(-90 310,380)">store raw</text>

  <!-- Worker to Splitter -->
  <line x1="260" y1="540" x2="391" y2="540" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="530" font-size="11" fill="#546E7A">process</text>

  <!-- Splitter to Embedder -->
  <line x1="560" y1="540" x2="591" y2="540" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="530" font-size="11" fill="#546E7A">chunk</text>

  <!-- Embedder to Qdrant -->
  <path d="M680,510 L680,475 L680,434" stroke="#546E7A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="685" y="480" font-size="11" fill="#546E7A">index</text>


  <!-- ========================================== -->
  <!-- SECTION 3: API & GENERATION (RIGHT) -->
  <!-- ========================================== -->
  <rect x="810" y="120" width="360" height="600" rx="10" fill="url(#gradApi)" stroke="#D1C4E9" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="825" y="150" font-size="14" font-weight="bold" fill="#6A1B9A" opacity="0.7">API & GENERATION</text>

  <!-- Gradio UI -->
  <g transform="translate(850, 180)" filter="url(#shadow)">
    <rect width="280" height="50" rx="6" fill="#F57F17" stroke="none"/>
    <text x="140" y="30" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">Gradio UI (Demo)</text>
  </g>

  <!-- FastAPI Node -->
  <g transform="translate(850, 280)" filter="url(#shadow)">
    <rect width="280" height="80" rx="6" fill="#009688" stroke="none"/>
    <text x="140" y="35" text-anchor="middle" font-size="16" fill="#FFFFFF" font-weight="bold">FastAPI</text>
    <rect x="100" y="50" width="80" height="20" rx="4" fill="#004D40" opacity="0.5"/>
    <text x="140" y="64" text-anchor="middle" font-size="12" font-family="monospace" fill="#E0F2F1">/search</text>
  </g>

  <!-- Search Service -->
  <g transform="translate(850, 400)" filter="url(#shadow)">
    <rect width="280" height="70" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Search Service</text>
    <text x="140" y="45" text-anchor="middle" font-size="11" fill="#555">Hybrid (Dense+Sparse)</text>
    <text x="140" y="60" text-anchor="middle" font-size="11" fill="#555">Deduplication</text>
  </g>

  <!-- Generation Service -->
  <g transform="translate(850, 520)" filter="url(#shadow)">
    <rect width="160" height="100" rx="6" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Gen Service</text>
    <text x="80" y="50" text-anchor="middle" font-size="11" fill="#555">Model Registry</text>
    <text x="80" y="70" text-anchor="middle" font-size="11" fill="#555">Prompt Mgmt</text>
  </g>

  <!-- LLM Providers -->
  <g transform="translate(1050, 520)" filter="url(#shadow)">
    <rect width="100" height="100" rx="6" fill="#212121" stroke="none"/>
    <text x="50" y="25" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">LLM Providers</text>
    <!-- Provider Dots -->
    <circle cx="50" cy="45" r="3" fill="#FFFFFF"/>
    <text x="50" y="60" text-anchor="middle" font-size="10" fill="#BDBDBD">OpenAI</text>
    <text x="50" y="75" text-anchor="middle" font-size="10" fill="#BDBDBD">OpenRouter</text>
    <text x="50" y="90" text-anchor="middle" font-size="10" fill="#BDBDBD">HuggingFace</text>
  </g>

  <!-- Arrows API -->
  <!-- Gradio to FastAPI -->
  <line x1="990" y1="230" x2="990" y2="271" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="255" font-size="11" fill="#546E7A">query</text>

  <!-- FastAPI to Search Service -->
  <line x1="990" y1="360" x2="990" y2="391" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="380" font-size="11" fill="#546E7A">invoke</text>

  <!-- Search Service to Qdrant (Retrieve) -->
  <path d="M850,435 L770,435 L770,424" stroke="#546E7A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="780" y="450" font-size="11" fill="#546E7A">retrieve</text>

  <!-- Search Service to Gen Service -->
  <path d="M930,470 L930,511" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="935" y="495" font-size="11" fill="#546E7A">context</text>

  <!-- Gen Service to LLM -->
  <line x1="1010" y1="570" x2="1041" y2="570" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1012" y="560" font-size="11" fill="#546E7A">generate</text>
  
  <!-- LLM Stream Back (Curved) -->
  <path d="M1100,620 C1100,750 800,750 990,370" stroke="#FF7043" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.6" marker-end="url(#arrow)"/>
  <text x="1050" y="680" font-size="11" fill="#FF7043">stream response</text>

  <!-- ========================================== -->
  <!-- SECTION 4: DEVOPS / DEPLOYMENT (TOP) -->
  <!-- ========================================== -->
  <g transform="translate(500, 30)">
    <rect width="500" height="40" rx="20" fill="#ECEFF1" stroke="#B0BEC5"/>
    <text x="250" y="25" text-anchor="middle" font-size="12" fill="#455A64" font-weight="bold">DEVOPS INFRASTRUCTURE: Docker • Cloud Run • CI/CD Pipeline</text>
    <!-- Connectors down -->
    <line x1="100" y1="40" x2="100" y2="120" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="250" y1="40" x2="250" y2="120" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="400" y1="40" x2="400" y2="120" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- LEGEND -->
  <g transform="translate(30, 740)">
    <rect width="250" height="40" rx="5" fill="#FFFFFF" stroke="#CFD8DC"/>
    <circle cx="20" cy="20" r="5" fill="#00897B"/>
    <text x="35" y="24" font-size="10" fill="#333">Ingest</text>
    <circle cx="80" cy="20" r="5" fill="#3CD186"/>
    <text x="95" y="24" font-size="10" fill="#333">Storage</text>
    <circle cx="150" cy="20" r="5" fill="#009688"/>
    <text x="165" y="24" font-size="10" fill="#333">Compute/API</text>
  </g>

</svg>
